name: release

# Build and publish native app builds whenever a version tag (e.g. v0.2.0) is
# pushed:  git tag v0.2.0 && git push origin v0.2.0
#
# The native window uses each OS's web engine, so builds are per-OS (cgo) rather
# than cross-compiled from one runner. macOS is verified; Windows/Linux use the
# standard cgo setup and are best validated on a real tag push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: macos }
          - { os: ubuntu-latest,  target: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # macOS → a real PortaSSH.app bundle (no console), ad-hoc signed, zipped.
      - name: Build macOS app
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          scripts/build-macapp.sh "$VERSION" arm64
          codesign --force --deep -s - dist/PortaSSH.app
          ( cd dist && zip -qry "portassh-$VERSION-macos-arm64.app.zip" PortaSSH.app && rm -rf PortaSSH.app )

      # Linux → native binary; needs GTK + WebKitGTK dev libs to build.
      - name: Build Linux binary
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "portassh-$VERSION-linux-amd64" .
          tar -C . -czf "dist/portassh-$VERSION-linux-amd64.tar.gz" "portassh-$VERSION-linux-amd64"

      # Windows → GUI subsystem exe (no console window), zipped.
      - name: Build Windows exe
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o portassh.exe .
          7z a "dist/portassh-$VERSION-windows-amd64.zip" portassh.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          echo "----- artifacts -----"; ls -la dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          echo "----- SHA256SUMS -----"; cat SHA256SUMS

      # Signing is optional: without the GPG_PRIVATE_KEY secret the release still
      # publishes, just without .asc files.
      - name: Detect signing key
        id: signing
        env:
          HAS_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "enabled=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Import GPG signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: GPG-sign artifacts
        if: steps.signing.outputs.enabled == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd dist
          for f in $(ls | grep -v '\.asc$'); do
            printf '%s' "${GPG_PASSPHRASE:-}" | gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --output "$f.asc" "$f"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
