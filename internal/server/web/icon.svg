<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="920" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.52" stop-color="#7b8ff9"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(320 260) rotate(45) scale(760)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="512" y1="64" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="512" y1="320" x2="512" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9efff"/>
    </linearGradient>
    <filter id="markShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#141a33" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- squircle base -->
  <rect x="64" y="64" width="896" height="896" rx="228" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="228" fill="url(#glow)"/>
  <rect x="64" y="64" width="896" height="896" rx="228" fill="url(#gloss)"/>
  <!-- crisp inner hairline for depth -->
  <rect x="66" y="66" width="892" height="892" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="4"/>

  <!-- terminal prompt: chevron + cursor -->
  <g filter="url(#markShadow)">
    <path d="M338 330 L560 512 L338 694" fill="none" stroke="url(#mark)"
          stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="566" y="636" width="196" height="60" rx="30" fill="url(#mark)"/>
  </g>
</svg>
